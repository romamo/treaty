name: CI

on:
  push:
    branches: [main]
  # A pull request runs on Ubuntu only, unless it carries the full-ci label; pushes to
  # main and the release workflows that call this one run every OS
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      ref:
        description: Git ref to check, e.g. refs/tags/v0.0.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The spec commit treaty is verified against; tests find it as the sibling checkout
  SPEC_REF: 2939540811fd92ee64ea4c43ecfc1657e84cbcb0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - run: uv sync --locked
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src examples

      - name: Audit treaty's own CLI, warnings included
        run: uv run treaty audit treaty._cli:cli --strict --format plain

      - name: Check AGENTS.md against the CLI (REQ-O-046)
        run: uv run treaty check-docs treaty._cli:cli AGENTS.md --format plain

      - name: Install as AGENTS.md documents it, twice and with no stdin (REQ-O-044)
        run: |
          uv tool install treaty < /dev/null
          uv tool install treaty < /dev/null
          "$(uv tool dir --bin)/treaty" --version

      - name: Install this checkout as a tool; its --version is the project's
        run: |
          uv tool install --reinstall . < /dev/null
          got="$("$(uv tool dir --bin)/treaty" --version --format plain)"
          want="$(uv run python -c 'import sys; from treaty._values import ToolVersion; print(ToolVersion.of_release(sys.argv[1]))' "$(uv version --short)")"
          test "$got" = "$want" || { echo "treaty --version is $got, pyproject says $want"; exit 1; }

  test:
    strategy:
      fail-fast: false
      # Every OS, plus free-threaded CPython (PEP 779, the GIL off); Ubuntu alone on a pull
      # request without the full-ci label
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '{"os":["ubuntu-latest"],"python":["3.14"]}' || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"python":["3.14"],"include":[{"os":"ubuntu-latest","python":"3.14t"}]}') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Fetch the spec as a sibling checkout
        run: |
          git init -q ../cli-agent-ergonomics
          cd ../cli-agent-ergonomics
          git fetch -q --depth 1 https://github.com/cli-agent-spec/cli-agent-spec "$SPEC_REF"
          git checkout -q FETCH_HEAD

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - run: uv sync --locked

      - name: The free-threaded job runs with the GIL off
        if: endsWith(matrix.python, 't')
        run: uv run python -c 'import sys; assert sys._is_gil_enabled() is False, sys.version'

      - run: uv run pytest -rs

  scaffold:
    # The documented path for a new project: init beside a spec checkout, then the kit
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '{"os":["ubuntu-latest"]}' || '{"os":["ubuntu-latest","macos-latest","windows-latest"]}') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Fetch the spec beside the new project
        working-directory: ${{ runner.temp }}
        run: |
          git init -q cli-agent-ergonomics
          cd cli-agent-ergonomics
          git fetch -q --depth 1 https://github.com/cli-agent-spec/cli-agent-spec "$SPEC_REF"
          git checkout -q FETCH_HEAD

      - name: Scaffold a project, test it, and run the kit against it
        working-directory: ${{ runner.temp }}
        run: |
          uv run --locked --project "$GITHUB_WORKSPACE" treaty init shop-tool --treaty-source "$GITHUB_WORKSPACE"
          cd shop-tool
          uv sync
          uv run pytest -q
          uv run treaty conformance shop_tool.cli:app --run

      - name: Install the project as its AGENTS.md documents it, twice and with no stdin
        working-directory: ${{ runner.temp }}/shop-tool
        run: |
          uv tool install . < /dev/null
          uv tool install . < /dev/null
          "$(uv tool dir --bin)/shop-tool" --version
