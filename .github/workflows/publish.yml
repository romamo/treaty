name: Publish

# shipmill's release workflow starts this on each tag it pushes (.github/shipmill.toml)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.0.1
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag }}

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Check the tag matches the project version
        run: test "v$(uv version --short)" = "$TAG"

      - run: uv build --out-dir dist

      - name: Check the sdist leaves out tooling
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '^[^/]+/(\.github|\.agents?|\.claude|uv\.lock)(/|$)'; then
            exit 1
          fi

      - name: Smoke-test the wheel and the sdist
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --python 3.14 --with "$dist" treaty --version
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/treaty/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
