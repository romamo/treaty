name: Feature request
description: Propose a new capability or a change to the API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What an agent or a CLI author cannot do today, or does with difficulty
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you have in mind, with a short example
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: CLI Agent Spec requirement
      description: The REQ or failure mode this relates to, if any
      placeholder: REQ-C-001
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
