[project]
name = "treaty"
version = "0.0.1"
description = "Zero-dependency Python CLI framework implementing the CLI Agent Spec: manifests, envelopes, typed exit codes"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["cli", "agent", "ai", "manifest", "json", "exit-codes"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/romamo/treaty"
Repository = "https://github.com/romamo/treaty"
Issues = "https://github.com/romamo/treaty/issues"

[project.scripts]
treaty = "treaty._cli:main"

[project.optional-dependencies]
rich = ["rich>=13"]
pydantic = ["pydantic>=2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N802", "N818"]
