[project]
name = "treaty"
version = "1.0.0rc5"
description = "Zero-dependency Python CLI framework implementing the CLI Agent Spec: manifests, envelopes, typed exit codes"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "agent", "ai", "manifest", "json", "exit-codes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/romamo/treaty"
Repository = "https://github.com/romamo/treaty"
Issues = "https://github.com/romamo/treaty/issues"

[project.scripts]
treaty = "treaty._cli:main"
treaty-mcp = "treaty._mcp:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]
tiktoken = [
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "mypy>=1.14",
    "ruff>=0.9",
    "mcp>=2,<3",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.14"
# Tutorial files that are checked where they run: todo_typer.py in an environment with
# typer, and new_cli/ inside a project that treaty init created, where todo.cli exists
exclude = ['^examples/tutorial/todo_typer\.py$', '^examples/tutorial/new_cli/']

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N802", "N818"]
