[project]
name = "treaty"
version = "1.0.0rc38"
description = "Zero-dependency Python CLI framework implementing the CLI Agent Spec: manifests, envelopes, typed exit codes"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "agent", "ai", "manifest", "json", "exit-codes"]
authors = [{ name = "Roman Medvedev", email = "pypi@romavm.dev" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/romamo/treaty"
Documentation = "https://github.com/romamo/treaty/tree/main/docs"
Repository = "https://github.com/romamo/treaty"
Issues = "https://github.com/romamo/treaty/issues"
Changelog = "https://github.com/romamo/treaty/blob/main/CHANGELOG.md"

[project.scripts]
treaty = "treaty._cli:main"
treaty-mcp = "treaty._mcp:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]
tiktoken = [
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "jsonschema>=4.23",
    "mypy>=1.14",
    "ruff>=0.9",
    "mcp>=2,<3",
    "pydantic>=2.11",
    "typer>=0.12",
    "click>=8.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
python_version = "3.14"
# Tutorial files that are checked where they run: todo_typer.py and todo_pydantic.py in an
# environment with typer or pydantic-settings, and new_cli/ inside a project that treaty
# init created, where todo.cli exists
exclude = [
    '^examples/tutorial/todo_typer\.py$',
    '^examples/tutorial/todo_pydantic\.py$',
    '^examples/tutorial/new_cli/',
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "PLE2502"]
ignore = ["N802", "N818"]
